name: Build APK

# 在 Windows 上无法直接运行 Buildozer，用 GitHub Actions 的 Linux 云端
# 免费构建 APK，无需在本机装 WSL/虚拟机。
# 触发方式：push 到 main/master，或在 Actions 页面手动 Run workflow。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses-dev libstdc++6 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Prepare pinned python-for-android (v2026.05.09)
        run: |
          # 克隆到项目目录外，避免 p4a 源码被当成 APP 资源打包
          git clone https://github.com/kivy/python-for-android.git ../p4a
          git -C ../p4a fetch origin tag v2026.05.09
          git -C ../p4a checkout v2026.05.09
          git -C ../p4a log -1 --oneline
          # Kivy 配方的 python_depends 中 requests 会拉入
          # charset-normalizer（无安卓轮子，纯 Python 模块安装失败）。
          # 只移除 requests，保留 certifi/chardet/idna/urllib3/filetype，
          # 其中 filetype 是 Kivy 图像模块运行时必需，缺失会启动即崩。
          python3 - <<'PATCH'
          p = "../p4a/pythonforandroid/recipes/kivy/__init__.py"
          t = open(p).read()
          old = "    python_depends = ['certifi', 'chardet', 'idna', 'requests', 'urllib3', 'filetype']"
          new = "    python_depends = ['certifi', 'chardet', 'idna', 'urllib3', 'filetype']"
          assert old in t, "kivy python_depends line not found"
          open(p, "w").write(t.replace(old, new, 1))
          print("removed requests from kivy recipe python_depends")
          PATCH
          # <service> 必须位于 <application> 内，而 extra_manifest_xml
          # 只插入 <manifest> 下；把无障碍服务片段注入模板的
          # </application> 之前。
          python3 - <<'PATCH'
          tpl = "../p4a/pythonforandroid/bootstraps/_sdl_common/build/templates/AndroidManifest.tmpl.xml"
          snippet = open("service_manifest_snippet.xml").read()
          t = open(tpl).read()
          marker = "    </application>"
          assert marker in t, "application close tag not found"
          assert "MtA11yService" not in t, "service already injected"
          t = t.replace(marker, snippet + "\n" + marker, 1)
          open(tpl, "w").write(t)
          print("injected accessibility service into manifest template")
          PATCH

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer

      - name: Pre-install Android SDK packages (with retries)
        run: |
          # buildozer（当前版本）使用 legacy 布局 tools/bin/sdkmanager。
          # 提前放好 sdkmanager、平台 33 与 build-tools 37，
          # 避免构建中途下载遇到坏包（archive is not a ZIP）直接失败。
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_ROOT"
          if [ ! -x "$SDK_ROOT/tools/bin/sdkmanager" ]; then
            curl -fsSL --retry 5 -o /tmp/sdktools.zip \
              https://dl.google.com/android/repository/tools_r25.2.3-linux.zip
            unzip -q /tmp/sdktools.zip -d "$SDK_ROOT"
          fi
          CMDBIN="$SDK_ROOT/tools/bin/sdkmanager"
          chmod +x "$CMDBIN"
          yes | "$CMDBIN" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          ok=0
          for i in 1 2 3 4 5; do
            if "$CMDBIN" --sdk_root="$SDK_ROOT" "platforms;android-33" "build-tools;37.0.0"; then
              ok=1; break
            fi
            echo "sdkmanager attempt $i failed, retrying..."; sleep 5
          done
          test "$ok" -eq 1
          test -d "$SDK_ROOT/platforms/android-33"

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: imtlauncher-apk
          path: bin/*.apk
          retention-days: 30
