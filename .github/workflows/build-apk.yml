name: Build APK

# 在 Windows 上无法直接运行 Buildozer，用 GitHub Actions 的 Linux 云端
# 免费构建 APK，无需在本机装 WSL/虚拟机。
# 触发方式：push 到 main/master，或在 Actions 页面手动 Run workflow。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libstdc++6 cmake libffi-dev \
            libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: imtlauncher-apk
          path: bin/*.apk
          retention-days: 30
